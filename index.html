<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Wall Clock</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
        }

        .clock-glow {
            text-shadow:
                0 0 10px currentColor,
                0 0 25px currentColor,
                0 0 50px currentColor,
                0 0 100px currentColor;
        }

        .colon {
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            45% {
                opacity: 1;
            }

            50%,
            95% {
                opacity: 0.25;
            }

            100% {
                opacity: 1;
            }
        }

        .pulse-ring {
            animation: pulseRing 3s infinite;
        }

        @keyframes pulseRing {
            0% {
                transform: scale(0.95);
                opacity: 0.3;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.7;
            }

            100% {
                transform: scale(0.95);
                opacity: 0.3;
            }
        }

        .grid-bg {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dot {
            box-shadow: 0 0 12px #22c55e;
        }
    </style>
</head>

<body class="bg-black text-white min-h-screen">

    <!-- Background -->
    <main id="app" class="relative min-h-screen flex items-center justify-center overflow-hidden
           bg-gradient-to-br from-zinc-950 via-black to-zinc-900">

        <!-- Background Glow -->
        <div class="absolute w-[500px] h-[500px] rounded-full
                bg-cyan-500/10 blur-[120px] -top-40 -left-40"></div>

        <div class="absolute w-[500px] h-[500px] rounded-full
                bg-purple-500/10 blur-[120px] -bottom-40 -right-40"></div>

        <!-- Grid -->
        <div class="absolute inset-0 grid-bg"></div>

        <!-- Main Clock Container -->
        <section class="relative z-10 w-full max-w-7xl px-5">

            <!-- Header -->
            <div class="flex items-center justify-between mb-8">

                <div>
                    <p class="text-xs md:text-sm tracking-[0.35em] text-zinc-500 uppercase">
                        Digital Wall Clock
                    </p>

                    <div class="flex items-center gap-2 mt-2">
                        <span class="dot w-2 h-2 rounded-full bg-green-500"></span>
                        <span class="text-xs text-zinc-500 tracking-widest">
                            LIVE
                        </span>
                    </div>
                </div>

                <!-- Controls -->
                <div class="flex gap-2">

                    <button id="formatBtn" onclick="toggleFormat()" class="glass px-4 py-2 rounded-xl text-xs tracking-wider
                   hover:bg-white/10 transition">
                        12H
                    </button>

                    <button onclick="toggleFullscreen()" class="glass px-4 py-2 rounded-xl text-xs
                   hover:bg-white/10 transition">
                        ⛶
                    </button>

                    <button onclick="toggleTheme()" class="glass w-10 h-10 rounded-xl
                   hover:bg-white/10 transition">
                        ◐
                    </button>

                </div>
            </div>


            <!-- Clock -->
            <div class="relative">

                <!-- Decorative Ring -->
                <div class="pulse-ring absolute inset-0
                 border border-cyan-400/10 rounded-[3rem]
                 pointer-events-none"></div>

                <div class="glass rounded-[3rem] p-8 md:p-14
                 shadow-2xl shadow-black/50">

                    <!-- Time -->
                    <div id="clock" class="clock-glow text-center
                   text-[15vw] md:text-[11vw] lg:text-[9rem]
                   leading-none font-bold tracking-tight
                   text-cyan-400 select-none">
                        00:00:00
                    </div>

                    <!-- AM / PM -->
                    <div id="period" class="text-center text-lg md:text-2xl
                   tracking-[0.5em] text-cyan-300/70 mt-5">
                        AM
                    </div>

                    <!-- Date -->
                    <div id="date" class="text-center text-sm md:text-base
                   tracking-[0.25em] text-zinc-400 uppercase mt-10">
                        Wednesday, October 7, 2026
                    </div>

                </div>
            </div>


            <!-- Bottom Information -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-5">

                <!-- Location -->
                <div class="glass rounded-2xl p-5">
                    <p class="text-[10px] tracking-[0.3em] text-zinc-500 uppercase">
                        Location
                    </p>

                    <p class="mt-2 text-sm tracking-wider">
                        Your Local Time
                    </p>
                </div>


                <!-- Day -->
                <div class="glass rounded-2xl p-5 text-center">
                    <p class="text-[10px] tracking-[0.3em] text-zinc-500 uppercase">
                        Day
                    </p>

                    <p id="day" class="mt-2 text-sm tracking-wider">
                        Wednesday
                    </p>
                </div>


                <!-- Seconds -->
                <div class="glass rounded-2xl p-5 text-right">
                    <p class="text-[10px] tracking-[0.3em] text-zinc-500 uppercase">
                        Seconds
                    </p>

                    <p id="seconds" class="mt-2 text-sm tracking-wider text-cyan-400">
                        00
                    </p>
                </div>

            </div>


            <!-- Footer -->
            <div class="text-center mt-8">
                <p class="text-[9px] tracking-[0.4em] text-zinc-700 uppercase">
                    Always On • Always Accurate
                </p>
            </div>

        </section>

    </main>


    <script>

        let is24Hour = false;
        let darkMode = true;


        // ================================
        // UPDATE CLOCK
        // ================================

        function updateClock() {

            const now = new Date();

            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            let period = "";

            if (!is24Hour) {

                period = hours >= 12 ? "PM" : "AM";

                hours = hours % 12;

                if (hours === 0) {
                    hours = 12;
                }

            }

            hours = String(hours).padStart(2, '0');


            // Time
            document.getElementById("clock").innerHTML =
                `${hours}<span class="colon">:</span>${minutes}<span class="colon">:</span>${seconds}`;


            // Period
            document.getElementById("period").textContent =
                is24Hour ? "24 HOUR" : period;


            // Date
            const dateOptions = {
                weekday: "long",
                month: "long",
                day: "numeric",
                year: "numeric"
            };

            document.getElementById("date").textContent =
                now.toLocaleDateString("en-US", dateOptions);


            // Day
            document.getElementById("day").textContent =
                now.toLocaleDateString("en-US", {
                    weekday: "long"
                });


            // Seconds
            document.getElementById("seconds").textContent =
                String(now.getSeconds()).padStart(2, '0');
        }


        // ================================
        // 12 / 24 HOUR
        // ================================

        function toggleFormat() {

            is24Hour = !is24Hour;

            document.getElementById("formatBtn").textContent =
                is24Hour ? "24H" : "12H";

            updateClock();
        }


        // ================================
        // FULLSCREEN
        // ================================

        function toggleFullscreen() {

            if (!document.fullscreenElement) {

                document.documentElement.requestFullscreen();

            } else {

                document.exitFullscreen();

            }
        }


        // ================================
        // THEME
        // ================================

        function toggleTheme() {

            const app = document.getElementById("app");
            const clock = document.getElementById("clock");

            darkMode = !darkMode;

            if (darkMode) {

                app.className =
                    "relative min-h-screen flex items-center justify-center overflow-hidden " +
                    "bg-gradient-to-br from-zinc-950 via-black to-zinc-900";

                clock.classList.remove("text-purple-400");
                clock.classList.add("text-cyan-400");

            } else {

                app.className =
                    "relative min-h-screen flex items-center justify-center overflow-hidden " +
                    "bg-gradient-to-br from-slate-100 via-white to-slate-200 text-black";

                clock.classList.remove("text-cyan-400");
                clock.classList.add("text-purple-400");
            }
        }


        // Start clock
        updateClock();

        // Update every second
        setInterval(updateClock, 1000);

    </script>

</body>

</html>
